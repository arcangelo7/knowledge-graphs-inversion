services:
  benchmark_postgresql:
    image: postgres:13
    container_name: kgi-benchmark-postgresql
    environment:
      POSTGRES_PASSWORD: r2rml
      POSTGRES_USER: r2rml
      POSTGRES_DB: r2rml
    ports:
      - "5434:5432"
    volumes:
      - ./benchmark_postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U r2rml -d r2rml"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  gtfs_mysql:
    image: mysql:5.7
    container_name: kgi-gtfs-mysql
    profiles:
      - gtfs
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./gtfs-bench/generation/mysql_data/dump-gtfs-new.sql:/docker-entrypoint-initdb.d/01-dump.sql:ro
      - ./benchmarks/gtfs/mysql-grants.sql:/docker-entrypoint-initdb.d/02-grants.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  benchmark:
    build:
      context: .
      target: benchmark
    container_name: kgi-benchmark
    volumes:
      - .:/app
      - benchmark-venv:/app/.venv
    working_dir: /app
    depends_on:
      benchmark_postgresql:
        condition: service_healthy
    command: ["krown-benchmark"]
volumes:
  benchmark-venv:
