name: Run tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Pull RMLMapper Docker image
        run: docker pull rmlio/rmlmapper-java:v8.0.1

      - name: Run tests with coverage
        run: |
          uv run coverage run -m pytest -v
          uv run coverage xml
          echo "=== Coverage Report ==="
          uv run coverage report

      - name: Generate HTML coverage report
        if: matrix.python-version == '3.12'
        run: uv run coverage html -d htmlcov

      - name: Generate coverage badge
        if: matrix.python-version == '3.12'
        run: uv run genbadge coverage -i coverage.xml -o coverage-badge.svg

      - name: Upload coverage report
        if: matrix.python-version == '3.12' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: htmlcov

      - name: Upload coverage badge
        if: matrix.python-version == '3.12' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-badge
          path: coverage-badge.svg
