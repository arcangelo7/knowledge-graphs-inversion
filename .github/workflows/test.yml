name: Run tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        database: ["postgresql", "mysql"]

    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check out the test suites
        run: git submodule update --init r2rml_test_cases rml_io_registry

      - name: Install uv
        # astral-sh/setup-uv v10.0.1
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Install Java
        # actions/setup-java v6.0.0
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: "21"

      - name: Run PostgreSQL tests with coverage
        if: matrix.database == 'postgresql'
        run: |
          uv run coverage run -m pytest -v --database=postgresql
          uv run coverage xml
          echo "=== Coverage Report ==="
          uv run coverage report

      - name: Run MySQL R2RML conformance tests
        if: matrix.database == 'mysql'
        run: uv run pytest tests/test_conformance.py::test_r2rml_conformance -v --database=mysql

      - name: Generate HTML coverage report
        if: matrix.database == 'postgresql' && matrix.python-version == '3.12'
        run: uv run coverage html -d htmlcov

      - name: Generate coverage badge
        if: matrix.database == 'postgresql' && matrix.python-version == '3.12'
        run: uv run genbadge coverage -i coverage.xml -o coverage-badge.svg

      - name: Upload coverage report
        if: matrix.database == 'postgresql' && matrix.python-version == '3.12' && github.ref == 'refs/heads/master'
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-report
          path: htmlcov

      - name: Upload coverage badge
        if: matrix.database == 'postgresql' && matrix.python-version == '3.12' && github.ref == 'refs/heads/master'
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-badge
          path: coverage-badge.svg

  souffle-conformance:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [postgresql, mysql]

    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configure private submodule access
        env:
          REVERSE_R2RML_DEPLOY_KEY: ${{ secrets.REVERSE_R2RML_DEPLOY_KEY }}
        run: |
          set -o pipefail
          key_file="$RUNNER_TEMP/reverse-r2rml-deploy-key"
          printf '%s\n' "$REVERSE_R2RML_DEPLOY_KEY" > "$key_file"
          chmod 600 "$key_file"
          install -d -m 700 "$HOME/.ssh"
          curl --fail --silent --show-error https://api.github.com/meta |
            jq -r '.ssh_keys[] | "github.com " + .' > "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "GIT_SSH_COMMAND=ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"
          git config submodule.ReverseR2RML.url git@github.com:dtai-kg/ReverseR2RML.git

      - name: Install uv
        # astral-sh/setup-uv v10.0.1
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
          python-version: '3.13'

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Install Java
        # actions/setup-java v6.0.0
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '21'

      - name: Run Soufflé conformance tests
        run: make test-conformance FORWARD_ENGINE=souffle INVERSION_ENGINE=souffle DATABASE=${{ matrix.database }}
