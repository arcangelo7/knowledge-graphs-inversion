name: Run tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        database: ["postgresql", "mysql"]

    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Check out the test suites
        run: git submodule update --init r2rml_test_cases rml_io_registry

      - name: Install uv
        # astral-sh/setup-uv v8.3.2
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Install Java
        # actions/setup-java v5.6.0
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Run PostgreSQL tests with coverage
        if: matrix.database == 'postgresql'
        run: |
          uv run coverage run -m pytest -v --database=postgresql
          uv run coverage xml
          echo "=== Coverage Report ==="
          uv run coverage report

      - name: Run MySQL R2RML conformance tests
        if: matrix.database == 'mysql'
        run: uv run pytest tests/test_conformance.py::test_r2rml_conformance -v --database=mysql

      - name: Generate HTML coverage report
        if: matrix.database == 'postgresql' && matrix.python-version == '3.12'
        run: uv run coverage html -d htmlcov

      - name: Generate coverage badge
        if: matrix.database == 'postgresql' && matrix.python-version == '3.12'
        run: uv run genbadge coverage -i coverage.xml -o coverage-badge.svg

      - name: Upload coverage report
        if: matrix.database == 'postgresql' && matrix.python-version == '3.12' && github.ref == 'refs/heads/master'
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-report
          path: htmlcov

      - name: Upload coverage badge
        if: matrix.database == 'postgresql' && matrix.python-version == '3.12' && github.ref == 'refs/heads/master'
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-badge
          path: coverage-badge.svg
