name: Run tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [master]

permissions:
  contents: write

env:
  COVERAGE_REPORT_PATH: htmlcov

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run tests with coverage
        run: |
          uv run coverage run -m pytest -v
          uv run coverage xml
          echo "=== Coverage Report ==="
          uv run coverage report
          echo "COVERAGE=$(uv run coverage report | grep TOTAL | awk '{print $4}')" >> $GITHUB_ENV

      - name: Generate HTML coverage report
        run: uv run coverage html -d htmlcov

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: ${{ env.COVERAGE_REPORT_PATH }}

      - name: Generate coverage badge
        if: matrix.python-version == '3.12'
        run: |
          COVERAGE_NUM=$(echo ${{ env.COVERAGE }} | sed 's/%//')

          if (( $(echo "$COVERAGE_NUM >= 90" | bc -l) )); then
            COLOR="green"
          elif (( $(echo "$COVERAGE_NUM >= 75" | bc -l) )); then
            COLOR="yellow"
          elif (( $(echo "$COVERAGE_NUM >= 60" | bc -l) )); then
            COLOR="orange"
          else
            COLOR="red"
          fi

          echo "BADGE_COLOR=$COLOR" >> $GITHUB_ENV

      - name: Create badge
        if: matrix.python-version == '3.12'
        uses: RubbaBoy/BYOB@v1.3.0
        with:
          name: knowledge-graphs-inversion-coverage-${{ github.ref_name }}
          label: "Coverage"
          status: "${{ env.COVERAGE }}"
          color: ${{ env.BADGE_COLOR }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repository: arcangelo7/knowledge-graphs-inversion
