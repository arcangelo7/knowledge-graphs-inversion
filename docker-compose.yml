services:
  app:
    build:
      context: .
      target: app
    container_name: kgi-app
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - app-venv:/app/.venv
    working_dir: /app
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
    depends_on:
      postgresql_r2rml:
        condition: service_healthy
      dest_postgresql_r2rml:
        condition: service_healthy
      postgresql_rml:
        condition: service_healthy
      dest_postgresql_rml:
        condition: service_healthy
      mysql_r2rml:
        condition: service_healthy
      dest_mysql_r2rml:
        condition: service_healthy
    restart: unless-stopped

  postgresql_r2rml:
    image: postgres:13
    container_name: kgi-postgresql-r2rml
    environment:
      POSTGRES_PASSWORD: r2rml
      POSTGRES_USER: r2rml
      POSTGRES_DB: r2rml
    ports:
      - "5440:5432"
    volumes:
      - ./postgresql_r2rml_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U r2rml -d r2rml"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  dest_postgresql_r2rml:
    image: postgres:13
    container_name: kgi-dest-postgresql-r2rml
    environment:
      POSTGRES_PASSWORD: r2rml
      POSTGRES_USER: r2rml
      POSTGRES_DB: r2rml
    ports:
      - "5441:5432"
    volumes:
      - ./dest_postgresql_r2rml_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U r2rml -d r2rml"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgresql_rml:
    image: postgres:13
    container_name: kgi-postgresql-rml
    environment:
      POSTGRES_PASSWORD: r2rml
      POSTGRES_USER: r2rml
      POSTGRES_DB: r2rml
    ports:
      - "5442:5432"
    volumes:
      - ./postgresql_rml_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U r2rml -d r2rml"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  dest_postgresql_rml:
    image: postgres:13
    container_name: kgi-dest-postgresql-rml
    environment:
      POSTGRES_PASSWORD: r2rml
      POSTGRES_USER: r2rml
      POSTGRES_DB: r2rml
    ports:
      - "5443:5432"
    volumes:
      - ./dest_postgresql_rml_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U r2rml -d r2rml"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mysql_r2rml:
    image: mysql:9.7.1
    container_name: kgi-mysql-r2rml
    command: --sql-mode=ANSI_QUOTES,PAD_CHAR_TO_FULL_LENGTH,PIPES_AS_CONCAT
    environment:
      MYSQL_ROOT_PASSWORD: r2rml
      MYSQL_USER: r2rml
      MYSQL_PASSWORD: r2rml
      MYSQL_DATABASE: r2rml
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  dest_mysql_r2rml:
    image: mysql:9.7.1
    container_name: kgi-dest-mysql-r2rml
    command: --sql-mode=ANSI_QUOTES,PAD_CHAR_TO_FULL_LENGTH,PIPES_AS_CONCAT
    environment:
      MYSQL_ROOT_PASSWORD: r2rml
      MYSQL_USER: r2rml
      MYSQL_PASSWORD: r2rml
      MYSQL_DATABASE: r2rml
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  app-venv:
