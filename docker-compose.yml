services:
  app:
    build: .
    container_name: kgi-app
    ports:
      - "5000:5000"
      - "8890:8890"  # Virtuoso HTTP port
      - "1111:1111"  # Virtuoso ISQL port
    volumes:
      - .:/app
      - app-venv:/app/.venv
    working_dir: /app
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - EMBEDDED_VIRTUOSO=true
    depends_on:
      postgresql_r2rml:
        condition: service_healthy
      dest_postgresql_r2rml:
        condition: service_healthy
      postgresql_rml:
        condition: service_healthy
      dest_postgresql_rml:
        condition: service_healthy
    restart: unless-stopped

  postgresql_r2rml:
    image: postgres:13
    container_name: kgi-postgresql-r2rml
    environment:
      POSTGRES_PASSWORD: r2rml
      POSTGRES_USER: r2rml
      POSTGRES_DB: r2rml
    ports:
      - "5440:5432"
    volumes:
      - ./postgresql_r2rml_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U r2rml -d r2rml"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  dest_postgresql_r2rml:
    image: postgres:13
    container_name: kgi-dest-postgresql-r2rml
    environment:
      POSTGRES_PASSWORD: r2rml
      POSTGRES_USER: r2rml
      POSTGRES_DB: r2rml
    ports:
      - "5441:5432"
    volumes:
      - ./dest_postgresql_r2rml_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U r2rml -d r2rml"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgresql_rml:
    image: postgres:13
    container_name: kgi-postgresql-rml
    environment:
      POSTGRES_PASSWORD: r2rml
      POSTGRES_USER: r2rml
      POSTGRES_DB: r2rml
    ports:
      - "5442:5432"
    volumes:
      - ./postgresql_rml_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U r2rml -d r2rml"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  dest_postgresql_rml:
    image: postgres:13
    container_name: kgi-dest-postgresql-rml
    environment:
      POSTGRES_PASSWORD: r2rml
      POSTGRES_USER: r2rml
      POSTGRES_DB: r2rml
    ports:
      - "5443:5432"
    volumes:
      - ./dest_postgresql_rml_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U r2rml -d r2rml"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  app-venv:
