[project]
name = "knowledge-graphs-inversion"
version = "1.2.0"
description = "Knowledge graphs inversion tool using R2RML and RML mappings"
authors = [
    { name = "Arcangelo Massari", email = "arcangelo.massari@unibo.it" }
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.3.3,<3.0.0",
    "sqlalchemy>=2.0.51,<3.0.0",
    "morph-kgc>=2.10.0,<3.0.0",
    "flask>=3.1.3",
    "psycopg2-binary>=2.9.12,<3.0.0",
    "mysql-connector-python>=9.7.0",
    "sparqlite>=1.2.1",
    "pyoxigraph>=0.5.9",
    "rich>=15.0.0",
    "falcon>=4.3.1", # morph-kgc depends on falcon 3.x which fails to build on Python 3.13+
]

[tool.uv]
override-dependencies = [
    "pyoxigraph>=0.5.6",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "master"
build_command = ""
commit_message = "chore: release v{version} [skip ci]"
commit_parser = "angular"
tag_format = "v{version}"

[tool.semantic_release.branches.master]
match = "master"
prerelease = false

[tool.semantic_release.commit_parser_options]
# Parse conventional commits
allowed_tags = [
    "feat",    # New feature (minor version bump)
    "fix",     # Bug fix (patch version bump)
    "docs",    # Documentation changes
    "style",   # Code style changes (formatting, etc)
    "refactor",# Code refactoring
    "perf",    # Performance improvements
    "test",    # Adding or updating tests
    "build",   # Build system changes
    "ci",      # CI/CD changes
    "chore",   # Other changes
    "revert"   # Revert previous commit
]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.changelog]
exclude_commit_patterns = []

[tool.semantic_release.changelog.environment]
keep_trailing_newline = true

[dependency-groups]
dev = [
    "genbadge[coverage]>=1.1.3",
    "jsonschema>=4.26.0",
    "jupyter-book>=2.1.6",
    "matplotlib>=3.11.0",
    "numpy>=2.3.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "reuse>=6.2.0",
    "ruff>=0.15.20",
    "scipy>=1.17.1",
    "watchdog[watchmedo]>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = [
    "app.py",
    "benchmarks",
    "database_connection.py",
    "kgi",
    "rmlmapper.py",
    "test_suites.py",
    "tests",
]

[tool.ruff]
include = [
    "app.py",
    "benchmarks/**/*.py",
    "database_connection.py",
    "kgi/**/*.py",
    "pyproject.toml",
    "rmlmapper.py",
    "test_suites.py",
    "tests/**/*.py",
]

[tool.coverage.run]
source = ["kgi"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
]
