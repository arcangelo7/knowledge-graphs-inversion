[project]
name = "knowledge-graphs-inversion"
version = "1.2.0"
description = "Knowledge graphs inversion tool using R2RML and RML mappings"
authors = [
    { name = "Arcangelo Massari", email = "arcangelo.massari@unibo.it" }
]
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "pandas>=2.3.0,<3.0.0",
    "sqlalchemy>=2.0.41,<3.0.0",
    "docker>=7.1.0,<8.0.0",
    "morph-kgc>=2.8.1,<3.0.0",
    "pyrdf4j>=0.1.1,<0.2.0",
    "jsonpath-ng>=1.7.0,<2.0.0",
    "flask>=3.1.1",
    "psycopg2-binary>=2.9.0,<3.0.0",
    "mysql-connector-python>=9.3.0",
    "numpy>=1.21.0",
    "jsonschema>=4.0.0",
    "virtuoso-utilities>=1.3.0",
    "sql-metadata>=2.17.0",
    "scipy>=1.16.2",
    "matplotlib>=3.10.7",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "master"
build_command = ""
commit_message = "chore: release v{version} [skip ci]"
commit_parser = "angular"
tag_format = "v{version}"

[tool.semantic_release.branches.master]
match = "master"
prerelease = false

[tool.semantic_release.commit_parser_options]
# Parse conventional commits
allowed_tags = [
    "feat",    # New feature (minor version bump)
    "fix",     # Bug fix (patch version bump)
    "docs",    # Documentation changes
    "style",   # Code style changes (formatting, etc)
    "refactor",# Code refactoring
    "perf",    # Performance improvements
    "test",    # Adding or updating tests
    "build",   # Build system changes
    "ci",      # CI/CD changes
    "chore",   # Other changes
    "revert"   # Revert previous commit
]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.changelog]
exclude_commit_patterns = []

[tool.semantic_release.changelog.environment]
keep_trailing_newline = true

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "ruff>=0.15.5",
]
